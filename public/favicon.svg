<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Base container rounded squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />
  <rect x="12" y="12" width="104" height="104" rx="22" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Check card background -->
  <rect x="22" y="34" width="84" height="60" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />
  
  <!-- Top banner stripe on check -->
  <path d="M22 42 Q22 34 30 34 L98 34 Q106 34 106 42 L106 48 L22 48 Z" fill="url(#emeraldGrad)" opacity="0.9" />

  <!-- Lines -->
  <line x1="30" y1="58" x2="68" y2="58" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.5 5" />
  <line x1="30" y1="68" x2="60" y2="68" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <line x1="30" y1="78" x2="52" y2="78" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

  <!-- Security Checkmark / Verification Stamp -->
  <circle cx="86" cy="68" r="14" fill="url(#goldGrad)" />
  
  <!-- Dollar Emblem -->
  <path d="M86 60 V76 M83 62 C85 61 88 61 89 63 C90 64 90 66 88 67 L84 69 C82 70 82 72 83 73 C84 75 87 75 89 74" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Top Arrow -->
  <path d="M46 22 L82 22 M76 17 L82 22 L76 27" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
